name: Build .deb for release

# Publish a GitHub release (e.g. `gh release create v1.1.0 --generate-notes`) and this
# builds dut_<version>_all.deb from that tag and attaches it to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check Python syntax
        run: python3 -m py_compile dut dut-collector
      - name: Build package
        run: |
          umask 022
          DEB=$(packaging/build-deb.sh "$TAG")
          dpkg-deb -I "$DEB"
          echo "DEB=$DEB" >> "$GITHUB_ENV"
      - name: Attach to release
        run: gh release upload "$TAG" "$DEB" --clobber
